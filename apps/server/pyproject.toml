[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelai"
version = "0.1.0"
description = "SentinelAI backend — AI-powered Investigation Intelligence Platform (modular monolith)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SentinelAI Team" }]

# Runtime stack is fixed by docs/backend-implementation-guide.md and ADR 0002.
# Do not substitute libraries (no Django/Flask/Celery/SQLModel/sync DB access).
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "arq>=0.26",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pyjwt[crypto]>=2.8",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    # S3-compatible object storage client (MinIO/S3) — the client named by
    # backend-implementation-guide.md Part 9's ObjectStorage sketch (ADR-0008).
    "aioboto3>=13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "factory-boy>=3.3",
    "asgi-lifespan>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelai"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID", "RUF"]
# TID251/TID252 enforce absolute imports (no relative cross-module imports).

[tool.ruff.lint.isort]
known-first-party = ["sentinelai"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection callables are immutable sentinels intended to be used as
# argument defaults (guide Part 2). Without this, B008 fires on every `= Depends(...)` /
# `= Query(...)` — the standard FastAPI ruff configuration, not a rule relaxation.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    # Project dependency-marker factories (return a Depends-compatible callable — the same
    # deferred-evaluation contract as FastAPI's own, so safe as an argument default).
    "sentinelai.platform.auth.dependencies.require_role",
    "sentinelai.platform.auth.dependencies.require_case_access",
]

# ---------------------------------------------------------------------------
# mypy — strict typing (docs/backend-implementation-guide.md Part 1)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

# The aioboto3/botocore S3 client (guide Part 9) ships no type information; treat it as untyped
# so the storage adapter can use it under strict mypy without per-call ignores.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "botocore.*", "boto3.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# import-linter — enforce the module dependency DAG (database-design.md §5,
# backend-implementation-guide.md Part 1 "Import Rules & Dependency Direction").
# Layers are listed highest → lowest; a layer may import lower layers only.
# Sibling modules on one layer (separated by " : ") are independent of each
# other. investigation sits ABOVE the domain modules, so it may import them
# (the documented exception); they may never import each other.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "sentinelai"

[[tool.importlinter.contracts]]
name = "Module dependency DAG (database-design.md section 5)"
type = "layers"
layers = [
    "sentinelai.entrypoints",
    "sentinelai.modules.notification",
    "sentinelai.modules.investigation",
    "sentinelai.modules.case_management : sentinelai.modules.social_media : sentinelai.modules.forensics : sentinelai.modules.threat_intel : sentinelai.modules.osint",
    "sentinelai.modules.ingestion",
    "sentinelai.platform",
    "sentinelai.shared",
]

[[tool.importlinter.contracts]]
name = "platform is domain-agnostic"
type = "forbidden"
source_modules = ["sentinelai.platform"]
forbidden_modules = ["sentinelai.modules"]
