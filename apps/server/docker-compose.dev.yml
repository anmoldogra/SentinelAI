# Local dev stack: postgres + redis + the two backend entrypoints (built from one image) + the
# Vite dev server for apps/web, so one command brings up the whole system an analyst would use.
# The repo-root docker-compose.yml provisions the broader infra baseline (object storage, event
# stream, vector store); this file is the fast inner-loop.
#
# It lives under apps/server for historical reasons and because the backend image builds from
# this directory; the `web` service reaches up to ../web, which Compose resolves relative to this
# file. Worth relocating to the repo root if a third app ever joins.

name: sentinelai-server-dev

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: sentinelai
      POSTGRES_DB: sentinelai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "sentinelai.entrypoints.http.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelai:sentinelai@postgres:5432/sentinelai
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["arq", "sentinelai.entrypoints.worker.main.WorkerSettings"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelai:sentinelai@postgres:5432/sentinelai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Vite dev server for apps/web. Dev-only: no image is built here, the source is bind-mounted
  # so hot-module reload works against the editor. Production ships static assets with no Node
  # runtime at all (frontend-architecture.md §2), which is a separate concern from this file.
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    # `npm ci` (not `install`) so the container reproduces the lockfile exactly, and the host's
    # node_modules — built for the developer's OS — can never leak in.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      # Inside the compose network `localhost` is this container, not the API. The proxy target
      # is configurable precisely so it can point at the service name here.
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ../web:/app
      # Anonymous volume, and it is load-bearing: without it the bind mount above would shadow
      # the container's node_modules with the host's, whose esbuild/rollup binaries are compiled
      # for the host OS and will not run on linux.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
