# Shared Alembic configuration for SentinelAI's per-module migration environments.
#
# Each module owns its own schema + migration history (database-design.md §11).
# There is one named section per schema below; the runner (scripts/migrate.sh)
# invokes `alembic -c alembic.ini -n <schema> upgrade head` per module in the
# database-design.md §5 DAG order. Every env.py reads the DB URL from settings
# (platform/config.py) and pins its own `version_table_schema`, so no
# `sqlalchemy.url` is set here.

[alembic]
# Default section = platform (first in DAG order). Overridden per-run via -n.
script_location = src/sentinelai/platform/migrations
prepend_sys_path = src

[platform]
script_location = src/sentinelai/platform/migrations
prepend_sys_path = src

[ingestion]
script_location = src/sentinelai/modules/ingestion/migrations
prepend_sys_path = src

[osint]
script_location = src/sentinelai/modules/osint/migrations
prepend_sys_path = src

[threat_intel]
script_location = src/sentinelai/modules/threat_intel/migrations
prepend_sys_path = src

[forensics]
script_location = src/sentinelai/modules/forensics/migrations
prepend_sys_path = src

[social_media]
script_location = src/sentinelai/modules/social_media/migrations
prepend_sys_path = src

[case_management]
script_location = src/sentinelai/modules/case_management/migrations
prepend_sys_path = src

[investigation]
script_location = src/sentinelai/modules/investigation/migrations
prepend_sys_path = src

[notification]
script_location = src/sentinelai/modules/notification/migrations
prepend_sys_path = src

# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
